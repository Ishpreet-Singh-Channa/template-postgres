name: ${PROJECT_NAME}

services:
    postgres:
        image: pgvector/pgvector:pg${POSTGRES_VERSION}
        container_name: ${PROJECT_NAME}-db
        environment:
            - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
            - POSTGRES_USER=${POSTGRES_USER}
            - POSTGRES_DB=${POSTGRES_DB}
        volumes:
            - ./database/data:/var/lib/postgresql/data
            - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql

    hasura:
        image: hasura/graphql-engine:v2.40.0
        container_name: ${PROJECT_NAME}-hasura
        restart: always
        depends_on:
            - postgres
        environment:
            - HASURA_GRAPHQL_DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${PROJECT_NAME}-db:5432/${POSTGRES_DB}
            - HASURA_GRAPHQL_ENABLE_CONSOLE=${HASURA_GRAPHQL_ENABLE_CONSOLE}
            - HASURA_GRAPHQL_ADMIN_SECRET=${HASURA_GRAPHQL_ADMIN_SECRET}
        ports:
            - ${HASURA_PORT}:8080

    backup:
        container_name: ${PROJECT_NAME}-auto-backup
        build:
            context: ./backup
            dockerfile: ./dockerfile
            args:
                POSTGRES_VERSION: ${POSTGRES_VERSION}
        depends_on:
            - postgres
        volumes:
            - ./backup/data:/backups
        environment:
            - BACKUP_INTERVAL=${BACKUP_INTERVAL}
            - POSTGRES_USER=${POSTGRES_USER}
            - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
            - POSTGRES_DB=${POSTGRES_DB}
            - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
            - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
            - AWS_REGION=${AWS_REGION}
            - AWS_S3_BUCKET=${AWS_S3_BUCKET}
