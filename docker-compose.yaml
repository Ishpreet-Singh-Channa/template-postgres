name: ${PROJECT_NAME}

services:
    main:
        image: pgvector/pgvector:pg18@sha256:2358fcba361ed2233a5ed81b5fe4ca779ccb304120ce531a3bf51c0ed7e2bc11
        container_name: ${PROJECT_NAME}-main
        restart: unless-stopped
        environment:
            - POSTGRES_DB=${MAIN_POSTGRES_DB}
            - POSTGRES_USER=${MAIN_POSTGRES_USER}
            - POSTGRES_PASSWORD=${MAIN_POSTGRES_PASSWORD}
        volumes:
            - ./data/main:/var/lib/postgresql/18
            - ./data/main.sql:/docker-entrypoint-initdb.d/init.sql
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${MAIN_POSTGRES_USER} -d ${MAIN_POSTGRES_DB}"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 10s

    meta:
        image: postgres:18@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
        container_name: ${PROJECT_NAME}-meta
        restart: unless-stopped
        environment:
            - POSTGRES_DB=${META_POSTGRES_DB}
            - POSTGRES_USER=${META_POSTGRES_USER}
            - POSTGRES_PASSWORD=${META_POSTGRES_PASSWORD}
        volumes:
            - ./data/meta:/var/lib/postgresql/18
            - ./data/meta.sql:/docker-entrypoint-initdb.d/init.sql
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${META_POSTGRES_USER} -d ${META_POSTGRES_DB}"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 10s

    hasura:
        image: hasura/graphql-engine:v2.51.0@sha256:5d435a6756de53709bf48c15b822cabab38d57acd22e656cf633cc2df67df150
        container_name: ${PROJECT_NAME}-hasura
        restart: unless-stopped
        ports: ['${EXPOSED_HASURA_PORT}:8080']
        environment:
            - HASURA_GRAPHQL_ENABLE_TELEMETRY=false
            - HASURA_GRAPHQL_DATABASE_URL=postgres://${MAIN_POSTGRES_USER}:${MAIN_POSTGRES_PASSWORD}@main:5432/${MAIN_POSTGRES_DB}
            - HASURA_GRAPHQL_METADATA_DATABASE_URL=postgres://${META_POSTGRES_USER}:${META_POSTGRES_PASSWORD}@meta:5432/${META_POSTGRES_DB}
            - HASURA_GRAPHQL_ADMIN_SECRET=${HASURA_ADMIN_SECRET}
            - HASURA_GRAPHQL_ENABLE_CONSOLE=${HASURA_ENABLE_CONSOLE}
            - HASURA_GRAPHQL_DEV_MODE=${HASURA_DEV_MODE}
        healthcheck:
            test: ["CMD-SHELL", "curl -f http://localhost:8080/healthz?strict=true || exit 1"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 10s
        depends_on:
            main:
                condition: service_healthy
            meta:
                condition: service_healthy
